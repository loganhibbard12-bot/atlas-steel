name: Bug report
description: Report a problem with Atlas Steel
labels: ["bug"]
body:
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Obsidian, Atlas VTT, and Atlas Steel versions
    validations:
      required: true
